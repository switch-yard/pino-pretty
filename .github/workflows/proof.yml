name: Proof

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Run a container
        run: docker run --rm alpine:3.20 sh -c 'echo "docker works on $(uname -m)"'

  sudo:
    name: System package
    runs-on: ubuntu-latest
    steps:
      - name: Install a package with sudo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq && jq --version
